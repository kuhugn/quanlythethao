<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản lý Thể thao Đa năng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { @apply bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4; }
        .btn { @apply px-4 py-2 rounded-xl font-semibold transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100; }
        .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700; }
        .btn-danger { @apply bg-red-500 text-white hover:bg-red-600; }
        .btn-secondary { @apply bg-gray-200 text-gray-700 hover:bg-gray-300; }
        .btn-outline { @apply border border-gray-200 text-gray-600 hover:bg-gray-50; }
        
        .modal-overlay { @apply fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity; }
        .modal-content { @apply bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl scale-100 transition-transform; }
        
        .hidden-modal { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <div id="app" class="max-w-md mx-auto p-4">
        <!-- Navigation Tabs -->
        <div class="flex gap-2 mb-6 bg-gray-200 p-1 rounded-xl">
            <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-2 rounded-lg text-sm font-bold transition-all bg-white shadow-sm">Buổi chơi</button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 rounded-lg text-sm font-bold text-gray-500">Lịch sử cũ</button>
            <button onclick="switchTab('players')" id="tab-players" class="flex-1 py-2 rounded-lg text-sm font-bold text-gray-500">Thành viên</button>
        </div>

        <!-- TAB 1: BUỔI CHƠI -->
        <div id="view-active">
            <div id="no-session" class="card text-center py-10">
                <div class="text-5xl mb-4">🏸</div>
                <h2 class="text-xl font-bold mb-2 text-gray-800">Chưa có buổi chơi nào</h2>
                <p class="text-gray-500 text-sm mb-6">Hãy bắt đầu một buổi chơi mới để ghi điểm</p>
                <button onclick="showNewSessionModal()" class="btn btn-primary w-full shadow-lg">Bắt đầu buổi mới</button>
            </div>

            <div id="active-session-ui" class="hidden">
                <!-- Session Header -->
                <div class="card bg-blue-600 text-white border-none shadow-lg shadow-blue-200">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span id="display-sport" class="text-xs font-black uppercase tracking-widest opacity-80">SPORT</span>
                            <h2 id="display-date" class="text-xl font-bold">Ngày 01/01</h2>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="copySummary('active')" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-[10px] font-black uppercase">Copy Zalo</button>
                            <button onclick="openConfirmModal('finish')" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-[10px] font-black uppercase">Kết thúc</button>
                        </div>
                    </div>
                </div>

                <!-- Live Summary -->
                <div class="card">
                    <h3 class="font-bold text-xs mb-3 text-gray-400 uppercase tracking-widest">Bảng điểm hiện tại</h3>
                    <div class="space-y-3" id="active-summary-list"></div>
                </div>

                <!-- Match Recorder -->
                <div class="card border-2 border-blue-50 shadow-md">
                    <h3 class="font-bold text-xs mb-4 text-gray-400 uppercase tracking-widest">Ghi kết quả trận</h3>
                    <div class="mb-5">
                        <p class="text-[10px] font-black text-green-600 mb-2 uppercase flex items-center gap-1">Đội Thắng 🏆 (Chọn thành viên)</p>
                        <div id="win-selection" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div class="mb-5">
                        <p class="text-[10px] font-black text-red-500 mb-2 uppercase flex items-center gap-1">Đội Thua 📉 (Chọn thành viên)</p>
                        <div id="lose-selection" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div class="flex gap-2 mb-4">
                        <button onclick="setAmount(50)" class="amt-btn btn btn-outline flex-1 text-sm font-bold" id="amt-50">50k</button>
                        <button onclick="setAmount(100)" class="amt-btn btn btn-outline flex-1 text-sm font-bold" id="amt-100">100k</button>
                        <input type="number" id="custom-amt" placeholder="Khác..." class="w-20 border-2 border-gray-100 rounded-xl px-2 text-center text-sm focus:ring-2 focus:ring-blue-500 outline-none font-bold">
                    </div>
                    <button onclick="recordMatch()" class="w-full btn btn-primary py-4 shadow-md uppercase tracking-widest">Lưu trận đấu</button>
                </div>

                <!-- Recent Matches -->
                <div id="recent-matches" class="space-y-2"></div>
            </div>
        </div>

        <!-- TAB 2: LỊCH SỬ CŨ -->
        <div id="view-history" class="hidden">
            <h2 class="text-xl font-bold mb-4 px-2 text-gray-800">Kho lưu trữ 📁</h2>
            <div id="history-container" class="space-y-3"></div>
        </div>

        <!-- TAB 3: THÀNH VIÊN -->
        <div id="view-players" class="hidden">
            <div class="card">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Danh sách nhóm 👥</h2>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="new-player-name" placeholder="Tên người mới..." class="flex-1 border-2 border-gray-100 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                    <button onclick="addNewPlayer()" class="btn btn-primary">Thêm</button>
                </div>
                <div id="full-player-list" class="space-y-2"></div>
            </div>
            <div class="px-2 text-center mt-12">
                <button onclick="openConfirmModal('resetAll')" class="text-[10px] text-red-400 font-bold uppercase opacity-50 hover:opacity-100 transition-opacity">Xóa trắng toàn bộ dữ liệu ứng dụng</button>
            </div>
        </div>
    </div>

    <!-- MODAL: BUỔI MỚI -->
    <div id="modal-new-session" class="modal-overlay hidden-modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Bắt đầu buổi mới 🏸</h3>
            <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase">Môn thể thao</label>
            <select id="input-sport" class="w-full border-2 border-gray-100 rounded-xl px-4 py-2 mb-4 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                <option value="Pickleball">Pickleball</option>
                <option value="Bóng bàn">Bóng bàn</option>
                <option value="Cầu lông">Cầu lông</option>
                <option value="Tennis">Tennis</option>
                <option value="Khác">Khác</option>
            </select>
            
            <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase">Chọn người tham gia hôm nay</label>
            <div id="modal-player-select" class="grid grid-cols-2 gap-2 mb-6 max-h-48 overflow-y-auto p-2"></div>

            <div class="flex gap-2">
                <button onclick="closeModal('modal-new-session')" class="flex-1 btn btn-secondary">Hủy</button>
                <button onclick="createNewSession()" class="flex-1 btn btn-primary">Bắt đầu</button>
            </div>
        </div>
    </div>

    <!-- MODAL: XÁC NHẬN -->
    <div id="modal-confirm" class="modal-overlay hidden-modal">
        <div class="modal-content text-center">
            <div id="confirm-icon" class="text-4xl mb-3">⚠️</div>
            <h3 id="confirm-title" class="text-xl font-bold mb-2 text-gray-800">Xác nhận</h3>
            <p id="confirm-message" class="text-gray-500 text-sm mb-6"></p>
            <div class="flex gap-2">
                <button onclick="closeModal('modal-confirm')" class="flex-1 btn btn-secondary">Hủy</button>
                <button id="confirm-action-btn" class="flex-1 btn btn-danger">Đồng ý</button>
            </div>
        </div>
    </div>

    <script>
        let db = { players: [], archives: [], activeSession: null };
        let selectedWinners = [];
        let selectedLosers = [];
        let currentBet = 50;
        let pendingAction = null;

        function init() {
            const saved = localStorage.getItem('sports_stable_final_v3');
            if (saved) db = JSON.parse(saved);
            renderAll();
            setAmount(50);
        }

        function saveData() {
            localStorage.setItem('sports_stable_final_v3', JSON.stringify(db));
        }

        function switchTab(tab) {
            ['active', 'history', 'players'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "flex-1 py-2 rounded-lg text-sm font-bold text-gray-500 transition-all";
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white shadow-sm transition-all";
            renderAll();
        }

        function addNewPlayer() {
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (name && !db.players.find(p => p.name === name)) {
                db.players.push({ name, id: Date.now().toString() });
                input.value = ''; saveData(); renderAll();
            }
        }

        function showNewSessionModal() {
            if (db.players.length === 0) {
                alert("Hãy thêm thành viên trước!");
                switchTab('players');
                return;
            }
            document.getElementById('modal-new-session').classList.remove('hidden-modal');
            const container = document.getElementById('modal-player-select');
            container.innerHTML = db.players.map(p => `
                <button onclick="toggleModalPlayer(this)" data-id="${p.id}" 
                        class="px-4 py-3 rounded-xl border-2 border-gray-100 text-sm font-bold bg-white transition-all text-gray-600 truncate">
                    ${p.name}
                </button>
            `).join('');
        }

        function toggleModalPlayer(btn) {
            btn.classList.toggle('border-blue-500');
            btn.classList.toggle('bg-blue-50');
            btn.classList.toggle('text-blue-700');
        }

        function createNewSession() {
            const sport = document.getElementById('input-sport').value;
            const selectedIds = Array.from(document.querySelectorAll('#modal-player-select .border-blue-500')).map(btn => btn.dataset.id);

            if (selectedIds.length < 2) return alert("Chọn ít nhất 2 người!");

            db.activeSession = {
                id: Date.now().toString(),
                sport: sport,
                date: new Date().toLocaleDateString('vi-VN'),
                matches: [],
                playersInSession: selectedIds.map(id => {
                    const p = db.players.find(x => x.id === id);
                    return { id: p.id, name: p.name, balance: 0 };
                })
            };
            closeModal('modal-new-session');
            saveData();
            renderAll();
        }

        function recordMatch() {
            const custom = document.getElementById('custom-amt').value;
            const amount = custom ? parseInt(custom) : currentBet;

            if (!selectedWinners.length || !selectedLosers.length) return alert("Chọn đội thắng và đội thua!");

            db.activeSession.matches.push({
                id: Date.now().toString(),
                winners: [...selectedWinners], 
                losers: [...selectedLosers], 
                amount,
                time: new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})
            });

            db.activeSession.playersInSession.forEach(p => {
                if (selectedWinners.includes(p.name)) p.balance += amount;
                if (selectedLosers.includes(p.name)) p.balance -= amount;
            });

            selectedWinners = []; selectedLosers = [];
            document.getElementById('custom-amt').value = '';
            saveData();
            renderAll();
        }

        function deleteMatch(matchId) {
            const mIdx = db.activeSession.matches.findIndex(m => m.id === matchId);
            if (mIdx === -1) return;
            const m = db.activeSession.matches[mIdx];
            db.activeSession.playersInSession.forEach(p => {
                if (m.winners.includes(p.name)) p.balance -= m.amount;
                if (m.losers.includes(p.name)) p.balance += m.amount;
            });
            db.activeSession.matches.splice(mIdx, 1);
            saveData();
            renderAll();
        }

        async function copySummary(id) {
            const s = (id === 'active') ? db.activeSession : db.archives.find(x => x.id === id);
            if (!s) return;

            let text = `🏆 TỔNG KẾT ${s.sport.toUpperCase()}\n📅 Ngày: ${s.date}\n`;
            text += `--------------------------\n`;
            text += `📝 NHẬT KÝ CÁC TRẬN:\n`;
            s.matches.forEach((m, i) => {
                text += `• Trận ${i+1}: ${m.winners.join(',')} ✅ vs ${m.losers.join(',')} ❌ [${m.amount}k]\n`;
            });
            text += `\n📊 BẢNG TIỀN CUỐI BUỔI:\n`;
            [...s.playersInSession].sort((a,b) => b.balance - a.balance).forEach((p, i) => {
                const icon = p.balance > 0 ? '🟢' : (p.balance < 0 ? '🔴' : '⚪');
                text += `${i+1}. ${p.name}: ${icon} ${p.balance > 0 ? '+' : ''}${p.balance}k\n`;
            });
            text += `--------------------------\nĐồng kiểm xong! ✅`;

            const successFeedback = (target) => {
                const oldText = target.innerText;
                target.innerText = "ĐÃ COPY!";
                setTimeout(() => target.innerText = oldText, 1500);
            };

            const targetBtn = event.currentTarget;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    successFeedback(targetBtn);
                } else { throw new Error(); }
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; textArea.style.left = "-9999px"; textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus(); textArea.select();
                try { document.execCommand('copy'); successFeedback(targetBtn); } catch (e) { alert("Lỗi sao chép!"); }
                textArea.remove();
            }
        }

        function editArchive(id) {
            if (db.activeSession) return alert("Kết thúc buổi hiện tại trước khi sửa buổi cũ!");
            const idx = db.archives.findIndex(a => a.id === id);
            if (idx > -1) {
                db.activeSession = JSON.parse(JSON.stringify(db.archives[idx]));
                db.archives.splice(idx, 1);
                saveData();
                switchTab('active');
            }
        }

        function renderAll() {
            // Player List
            document.getElementById('full-player-list').innerHTML = db.players.map(p => `
                <div class="flex justify-between items-center p-4 bg-white rounded-2xl border border-gray-100 shadow-sm">
                    <span class="font-bold text-gray-700">${p.name}</span>
                    <button onclick="openConfirmModal('deletePlayer', {id:'${p.id}', name:'${p.name}'})" class="text-red-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
            `).join('');

            // Active Session
            if (db.activeSession) {
                document.getElementById('no-session').classList.add('hidden');
                document.getElementById('active-session-ui').classList.remove('hidden');
                document.getElementById('display-sport').innerText = db.activeSession.sport;
                document.getElementById('display-date').innerText = db.activeSession.date;

                document.getElementById('active-summary-list').innerHTML = [...db.activeSession.playersInSession].sort((a,b) => b.balance - a.balance).map(p => `
                    <div class="flex justify-between items-center py-1 border-b border-gray-50">
                        <span class="font-medium text-gray-500">${p.name}</span>
                        <span class="font-black ${p.balance > 0 ? 'text-green-500' : (p.balance < 0 ? 'text-red-500' : 'text-gray-400')}">
                            ${p.balance > 0 ? '+' : ''}${p.balance}k
                        </span>
                    </div>
                `).join('');

                document.getElementById('recent-matches').innerHTML = [...db.activeSession.matches].reverse().map((m, i) => `
                    <div class="bg-white p-3 rounded-2xl border border-gray-100 text-[11px] flex items-center justify-between shadow-sm border-l-4 border-l-blue-500">
                        <div class="flex items-center gap-1.5 overflow-hidden">
                            <span class="text-green-600 font-bold truncate">${m.winners.join(', ')}</span>
                            <span class="text-gray-300 font-bold">vs</span>
                            <span class="text-red-500 font-bold truncate">${m.losers.join(', ')}</span>
                        </div>
                        <div class="flex items-center gap-4 pl-3">
                            <span class="font-black text-gray-800">${m.amount}k</span>
                            <button onclick="deleteMatch('${m.id}')" class="text-gray-300">🗑️</button>
                        </div>
                    </div>
                `).join('');

                renderSelectors();
            } else {
                document.getElementById('no-session').classList.remove('hidden');
                document.getElementById('active-session-ui').classList.add('hidden');
            }

            // History
            document.getElementById('history-container').innerHTML = [...db.archives].reverse().map(s => `
                <div class="card border-l-4 border-l-blue-500">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-[9px] font-black text-blue-500 uppercase">${s.sport}</span>
                            <h4 class="font-bold text-gray-800 text-sm">${s.date}</h4>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editArchive('${s.id}')" class="text-[9px] font-black bg-gray-100 text-gray-500 px-3 py-2 rounded-lg border border-gray-200">SỬA</button>
                            <button onclick="copySummary('${s.id}')" class="text-[9px] font-black bg-blue-50 text-blue-600 border border-blue-100 px-3 py-2 rounded-lg">COPY ZALO</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-[11px] opacity-80">
                        ${s.playersInSession.map(p => `
                            <div class="flex justify-between border-b border-gray-50">
                                <span class="font-bold text-gray-400">${p.name}</span>
                                <span class="${p.balance >= 0 ? 'text-green-600' : 'text-red-500'} font-black">${p.balance}k</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderSelectors() {
            const winBox = document.getElementById('win-selection');
            const loseBox = document.getElementById('lose-selection');
            if (!db.activeSession || !winBox || !loseBox) return;

            const players = db.activeSession.playersInSession;

            const makeBtns = (type, selectedArr) => players.map(p => {
                const isSelected = selectedArr.includes(p.name);
                // Gán trực tiếp class Tailwind cụ thể vào JS để đảm bảo hiển thị đúng màu
                let cls = "px-4 py-2 rounded-xl border-2 font-bold text-sm transition-all text-center min-w-[70px] m-0.5 ";
                if (isSelected) {
                    cls += type === 'win' 
                        ? "bg-green-600 text-white border-green-700 shadow-md ring-2 ring-green-300" 
                        : "bg-red-600 text-white border-red-700 shadow-md ring-2 ring-red-300";
                } else {
                    cls += "bg-white border-gray-100 text-gray-400 opacity-60";
                }
                return `<button onclick="togglePlayer('${p.name}', '${type}')" class="${cls}">${p.name}</button>`;
            }).join('');

            winBox.innerHTML = makeBtns('win', selectedWinners);
            loseBox.innerHTML = makeBtns('lose', selectedLosers);
        }

        function togglePlayer(name, type) {
            if (type === 'win') {
                if (selectedWinners.includes(name)) selectedWinners = selectedWinners.filter(n => n !== name);
                else if (!selectedLosers.includes(name)) selectedWinners.push(name);
            } else {
                if (selectedLosers.includes(name)) selectedLosers = selectedLosers.filter(n => n !== name);
                else if (!selectedWinners.includes(name)) selectedLosers.push(name);
            }
            renderSelectors();
        }

        function setAmount(amt) {
            currentBet = amt;
            document.querySelectorAll('.amt-btn').forEach(b => b.className = "amt-btn btn btn-outline flex-1 text-sm font-bold");
            const activeBtn = document.getElementById(`amt-${amt}`);
            if (activeBtn) activeBtn.className = "amt-btn btn flex-1 text-sm bg-blue-50 border-blue-500 text-blue-600 font-black";
            document.getElementById('custom-amt').value = '';
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden-modal'); }
        
        function openConfirmModal(type, data) {
            pendingAction = { type, data };
            const m = document.getElementById('modal-confirm');
            const title = document.getElementById('confirm-title');
            const msg = document.getElementById('confirm-message');
            const btn = document.getElementById('confirm-action-btn');
            if (type === 'finish') {
                title.innerText = "KẾT THÚC BUỔI?"; msg.innerText = "Lưu buổi chơi vào lịch sử.";
                btn.className = "flex-1 btn btn-primary text-xs uppercase font-bold";
            } else if (type === 'resetAll') {
                title.innerText = "XÓA TOÀN BỘ?"; msg.innerText = "Xóa mọi dữ liệu nhóm và lịch sử.";
                btn.className = "flex-1 btn bg-red-500 text-white text-xs uppercase font-bold";
            } else {
                title.innerText = "XÓA THÀNH VIÊN?"; msg.innerText = "Xóa khỏi nhóm cố định.";
                btn.className = "flex-1 btn bg-red-500 text-white text-xs uppercase font-bold";
            }
            btn.onclick = () => {
                if (pendingAction.type === 'finish') { db.archives.push(JSON.parse(JSON.stringify(db.activeSession))); db.activeSession = null; }
                else if (pendingAction.type === 'resetAll') { db = { players: [], archives: [], activeSession: null }; localStorage.clear(); }
                else if (pendingAction.type === 'deletePlayer') db.players = db.players.filter(p => p.id !== pendingAction.data.id);
                saveData(); renderAll(); closeModal('modal-confirm');
            };
            m.classList.remove('hidden-modal');
        }

        init();
    </script>
</body>
</html>
